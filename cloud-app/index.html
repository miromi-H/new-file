<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Файловое облако</title>
<link rel="stylesheet" href="/static/style.css?v=2">
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">☁</div>
      <div>
        <h1>Файловое облако</h1>
        <p>Локальное хранилище</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn new-folder" id="newFolderBtn">+ Папка</button>
      <button class="btn primary" id="uploadBtn">⬆ Загрузить</button>
      <input type="file" id="fileInput" multiple hidden>
    </div>
  </header>

  <nav id="breadcrumb" class="breadcrumb"></nav>

  <div class="toolbar">
    <div class="path">
      <span id="currentPathLabel">Корень</span>
      <span id="countLabel"></span>
    </div>
  </div>

  <main>
    <div id="dropHint" class="drop-hint" hidden>Отпустите файлы, чтобы загрузить</div>
    <table class="file-table">
      <thead>
        <tr>
          <th>Имя</th>
          <th>Размер</th>
          <th>Изменён</th>
          <th class="actions-col"></th>
        </tr>
      </thead>
      <tbody id="fileList"></tbody>
    </table>
    <div id="emptyState" class="empty-state" hidden>
      <div class="empty-icon">📂</div>
      <p>Папка пуста</p>
    </div>
    <div id="uploadProgress" class="progress-bar" hidden></div>
  </main>
</div>

<div id="contextMenu" class="context-menu" hidden>
  <button data-action="open">Открыть</button>
  <button data-action="download">Скачать</button>
  <button data-action="rename">Переименовать</button>
  <button data-action="delete" class="danger">Удалить</button>
</div>

<div id="modalOverlay" class="modal-overlay" hidden>
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <input type="text" id="modalInput" autocomplete="off">
    <p id="modalError" class="modal-error" hidden></p>
    <div class="modal-actions">
      <button class="btn" id="modalCancel">Отмена</button>
      <button class="btn primary" id="modalOk">ОК</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
